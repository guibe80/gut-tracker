<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f6f5c"><title>Gut + Glucose V3 setup</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f6;color:#17221e;margin:0;padding:24px}.card{max-width:600px;margin:40px auto;background:#fff;border:1px solid #d9e1dd;border-radius:16px;padding:20px}input,button{width:100%;min-height:46px;border:1px solid #d9e1dd;border-radius:11px;padding:10px 12px;font:inherit;box-sizing:border-box}button{margin-top:12px;background:#1f6f5c;color:#fff;font-weight:700}.muted{color:#61716b;font-size:14px}code{word-break:break-all}</style></head><body><div class="card"><h1>Gut + Glucose V3 setup</h1><p class="muted">Paste the Supabase <strong>publishable</strong> key for your project. Never paste a service/secret key here.</p><input id="key" type="password" placeholder="sb_publishable_…"><button id="save">Save and open tracker</button><p id="msg" class="muted"></p><p class="muted">The key is stored only in this browser's local storage. It is not committed to GitHub.</p></div><script>const key=document.getElementById('key');key.value=localStorage.getItem('gut_tracker_publishable_key')||'';document.getElementById('save').onclick=()=>{const v=key.value.trim();if(!v){document.getElementById('msg').textContent='Enter the publishable key first.';return}localStorage.setItem('gut_tracker_publishable_key',v);location.href='./index.html'};</script></body></html>
